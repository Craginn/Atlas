# Base44 dev environment for AI Atlas.
# Runs the Vite dev server from the cloned source with live reload.
# The app is offline-only — no database, no external services, no secrets.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    # Install deps (cached on the bind-mounted node_modules volume), then start
    # the Vite dev server with live reload.
    command: sh -c "npm install --legacy-peer-deps && npm install @jridgewell/set-array --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    volumes:
      # Bind-mount the cloned source so edits are reflected live.
      - ./:/app
      # Keep node_modules in a named volume so the container's install isn't
      # shadowed by an empty host mount, and reinstalls are fast.
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Passed through so the app can reference it if needed.
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
    restart: unless-stopped

volumes:
  web_node_modules:
